<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EA Sports FC 25 | Player Database</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body class="bg-slate-950 text-slate-100 antialiased font-sans">

  <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <h1 class="text-xl font-bold bg-linear-to-r from-yellow-400 to-orange-500 bg-clip-text text-transparent">
        EA FC 25 Database
      </h1>
      <div class="flex gap-4">
        <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-400">v2.0 Beta</span>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">

      <aside class="lg:col-span-1 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
          <h4 class="text-lg font-semibold mb-6 flex items-center gap-2">
            <span class="w-1 h-5 bg-orange-500 rounded-full"></span>
            Filters
          </h4>

          <div class="space-y-4">
            <div>
              <label class="text-xs text-slate-400 mb-1.5 block px-1">Position</label>
              <select id="position-select"
                class="w-full bg-slate-800 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500 transition-all outline-none">
                <option selected disabled value="">All Positions</option>
              </select>
            </div>

            <div>
              <label class="text-xs text-slate-400 mb-1.5 block px-1">Nationality</label>
              <select id="nationality-select"
                class="w-full bg-slate-800 border-none rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-orange-500 transition-all outline-none">
                <option selected disabled value="">All Nationalities</option>
              </select>
            </div>

            <button id="filter-btn"
              class="w-full bg-orange-600 hover:bg-orange-500 text-white font-medium py-3 rounded-xl transition-all shadow-lg shadow-orange-900/20 active:scale-[0.98]">
              Apply Filters
            </button>
          </div>
        </div>
      </aside>

      <section class="lg:col-span-3 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col md:flex-row gap-4 items-center">
          <div class="relative flex-1 w-full">
            <input type="text" id="search-field" placeholder="Search players, clubs..."
              class="w-full bg-slate-800 border-none rounded-xl pl-11 pr-4 py-3 text-sm focus:ring-2 focus:ring-orange-500 outline-none" />
            <svg class="w-5 h-5 absolute left-3.5 top-3.5 text-slate-500" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>

          <div class="flex items-center gap-2 bg-slate-800 p-1 rounded-xl w-full md:w-auto">
            <button class="flex-1 md:px-4 py-2 text-xs font-medium rounded-lg bg-orange-600 shadow-sm transition-all"
              id="sort-overall">Overall</button>
            <button
              class="flex-1 md:px-4 py-2 text-xs font-medium rounded-lg hover:bg-slate-700 transition-all text-slate-400"
              id="sort-name">Name</button>
            <button
              class="flex-1 md:px-4 py-2 text-xs font-medium rounded-lg hover:bg-slate-700 transition-all text-slate-400"
              id="sort-age">Age</button>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
          <div class="overflow-x-auto">
            <table id="players-table" class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-800/50 text-slate-400 text-xs uppercase tracking-wider">
                  <th class="px-6 py-4 font-medium">Player</th>
                  <th class="px-6 py-4 font-medium">Club</th>
                  <th class="px-6 py-4 font-medium text-center">OVR</th>
                  <th class="px-6 py-4 font-medium">Stats</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800">
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
