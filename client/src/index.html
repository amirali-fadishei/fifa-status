<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FC 24 Player Radar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__content container">
        <p class="text-uppercase text-secondary small mb-1">Live roster snapshot</p>
        <h1 class="display-6 fw-bold mb-2">FC 24 Player Radar</h1>
        <p class="lead text-body-secondary mb-0">
          Search and filter the latest star players with modern filters and fast responses powered by the refreshed API.
        </p>
      </div>
    </header>

    <main class="container py-4">
      <section class="filters shadow-sm">
        <div class="row gy-3 align-items-end">
          <div class="col-12 col-lg-4">
            <label for="search-field" class="form-label">Search by name or club</label>
            <input class="form-control" id="search-field" placeholder="Type to search..." />
          </div>
          <div class="col-6 col-lg-2">
            <label for="position-select" class="form-label">Position</label>
            <select id="position-select" class="form-select"></select>
          </div>
          <div class="col-6 col-lg-2">
            <label for="nationality-select" class="form-label">Nationality</label>
            <select id="nationality-select" class="form-select"></select>
          </div>
          <div class="col-6 col-lg-2">
            <label for="sort-select" class="form-label">Sort by</label>
            <select id="sort-select" class="form-select">
              <option value="overall">Overall</option>
              <option value="potential">Potential</option>
              <option value="name">Name</option>
              <option value="age">Age</option>
            </select>
          </div>
          <div class="col-6 col-lg-2 d-grid">
            <button id="reset-btn" class="btn btn-outline-secondary">Reset filters</button>
          </div>
        </div>
      </section>

      <section class="d-flex justify-content-between align-items-center mt-3 mb-2">
        <div id="summary-text" class="text-muted">Loading...</div>
        <div id="loading-banner" class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </section>

      <section id="players-grid" class="player-grid"></section>
    </main>
  </body>
</html>
